<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> exercise6 FAQ Section</title>
  <style>
    body{
        background-color: black;
        color: white;
        box-sizing: border-box;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 30px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    .answer {
      display: none; /* Hide answers by default */
      color: gray;
      margin-left: 20px;

    }
    .question {
      cursor: pointer; /* Indicate clickable element */
      font-weight: bold;
      margin: 10px ;
    }
  </style>
</head>
<body>
  <div id="faq">
    <div>
      <div class="question">What is JavaScript?</div>
      <div class="answer">JavaScript is a programming language for the web.</div>
    </div>
    <div>
      <div class="question">What is the DOM?</div>
      <div class="answer">The DOM is the Document Object Model of a webpage.</div>
    </div>
    <div>
      <div class="question">What is an event listener?</div>
      <div class="answer">An event listener listens for and reacts to user interactions.</div>
    </div>
  </div>

  <script>
   let question = document.querySelectorAll(".question");
   let answer = document.querySelectorAll('.answer');
   console.log(question);
    question.forEach((q)=>{
        q.addEventListener('click',(e)=>{
            let ans = e.target.nextElementSibling;
            // if(ans.style.display == "block"){
            //     ans.style.display = "none";
            // }else{
            //     ans.style.display = "block";
            // }
            ans.style.display = ans.style.display == "block" ? "none":"block";
        })

    })
  </script>
</body>
</html>
