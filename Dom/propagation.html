<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #parent {
        height: 500px;
        width: 500px;
        border: 2px solid black;
        background-color: lightblue;
      }
      #child {
        height: 250px;
        width: 250px;
        border: 2px solid black;
        background-color: blanchedalmond;
      }
      #innerchild {
        height: 125px;
        width: 125px;
        border: 2px solid black;
        background-color: aquamarine;

      }
    </style>
  </head>
  <body>
    <div id="parent">
      <div id="child">
        <div id="innerchild"></div>
      </div>
    </div>
    <script>
      let parent = document.getElementById("parent");
      let child = document.getElementById("child");
      let innerchild = document.getElementById("innerchild");
      // Bubbling phase (goes from root[body] to target[innerChild] i.e downwards)
    //   document.body.addEventListener('click', () => {
    //       console.log("Body Clicked");
    //   });

    //   parent.addEventListener('click', () => {
    //       console.log("Parent Clicked");
    //   });

    //   child.addEventListener('click', () => {
    //       console.log("Child Clicked");
    //   });

    //   innerChild.addEventListener('click', () => {
    //       console.log("InnerChild Clicked");
    //   });

      // In Console - InnerChild Clicked
      //              Child Clicked
      //              Parent Clicked
      //              Body Clicked

      // Capturing phase (goes from target[innerChild] to root[body] i.e upwards)
    //   document.body.addEventListener('click', () => {
    //       console.log("Body Clicked");
    //   }, true);

    //   parent.addEventListener('click', () => {
    //       console.log("Parent Clicked");
    //   }, true);

    //   child.addEventListener('click', () => {
    //       console.log("Child Clicked");
    //   }, true);

    //   innerChild.addEventListener('click', () => {
    //       console.log("InnerChild Clicked");
    //   }, true);

      // In Console - Body Clicked
      //              Parent Clicked
      //              Child Clicked
      //              InnerChild Clicked


      // stoppropogation
      document.body.addEventListener('click', () => {
          console.log("Body Clicked");
      });

      parent.addEventListener('click', () => {
          console.log("Parent Clicked");
      });

      child.addEventListener('click', (e) => {
          e.stopPropagation();
          console.log("Child Clicked");
      });

      innerChild.addEventListener('click', () => {
          console.log("InnerChild Clicked");
      });

      // In Console - InnerChild Clicked
      //              Child Clicked
      //  and then it will stop
    </script>
  </body>
</html>
