<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atttribute</title>
    <style>
        #main{
            height:100px;
            width:300px;
            background-color: lightsalmon;
        }
    </style>
</head>
<body>
    <div class = "main-class">Main</div>
    <script>
        let div = document.querySelector(".main-class");
        div.setAttribute("id","main");
        let divID = div.getAttribute("id");
        console.log(divID);
        div.removeAttribute("id");
    </script>
</body>
</html>
